name: Update Naver Reviews

on:
  workflow_dispatch: # 수동 실행 (GitHub 웹 UI에서 Run workflow 클릭)
  schedule:
    - cron: '0 0 1 * *' # 매월 1일 자정(UTC) 자동 실행

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install beautifulsoup4

      - name: 네이버 리뷰 수 업데이트 실행
        run: |
          python scripts/update_naver_reviews.py --delay 2 --save-interval 50

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add camping-search-rank-all.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 네이버 리뷰 데이터 최신화 [$(date +'%Y-%m-%d')]" && git push)
